# Publish @starreview/cli to npm via Trusted Publishing (OIDC — no tokens, no
# OTP). Modeled on the backend's npm-publish-mcp.yml. Manual trigger only:
#   gh workflow run npm-publish.yml
# Preconditions: @starreview/mcp@0.6.1 is already published, and the npm
# package settings for @starreview/cli list THIS repo + workflow as a trusted
# publisher.

name: npm-publish

on:
  workflow_dispatch:

jobs:
  release-ref:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require the main branch
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Refusing to publish from $GITHUB_REF; dispatch this workflow from main." >&2
            exit 1
          fi

  canary:
    needs: release-ref
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production-canary
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install exact contract and test dependencies
        run: npm install --ignore-scripts

      - name: Run tests
        run: npm test

      - name: Pack candidate
        shell: bash
        run: npm pack --silent > "$RUNNER_TEMP/starreview-package-name"

      - name: Exercise packed candidate (read-only)
        shell: bash
        env:
          STARREVIEW_CANARY_API_KEY: ${{ secrets.STARREVIEW_CANARY_PER_BUSINESS_API_KEY }}
          STARREVIEW_CANARY_BUSINESS_ID: ${{ vars.STARREVIEW_CANARY_BUSINESS_ID }}
          STARREVIEW_TIMEOUT_MS: '30000'
        run: |
          package_name="$(cat "$RUNNER_TEMP/starreview-package-name")"
          candidate_dir="$RUNNER_TEMP/starreview-cli-candidate"
          mkdir -p "$candidate_dir"
          tar -xzf "$package_name" -C "$candidate_dir"
          node "$candidate_dir/package/bin/starreview.js" --help > "$RUNNER_TEMP/starreview-help.txt" 2>&1
          node "$candidate_dir/package/scripts/production-canary.mjs"

  publish:
    needs: canary
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install exact contract and test dependencies
        run: npm install --ignore-scripts

      - name: Run tests
        run: npm test

      - name: Verify package contents
        run: npm run pack:check

      # --provenance emits a signed provenance statement (free with OIDC
      # trusted publishing; id-token: write above enables it).
      - name: Publish
        run: npm publish --access public --provenance

      - name: Verify registry release
        shell: bash
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          package_spec="${package_name}@${package_version}"

          published_version=""
          for attempt in {1..12}; do
            published_version="$(npm view "$package_spec" version 2>/dev/null || true)"
            if [[ "$published_version" == "$package_version" ]]; then
              break
            fi
            sleep 5
          done
          if [[ "$published_version" != "$package_version" ]]; then
            echo "Registry did not expose $package_spec after publication." >&2
            exit 1
          fi

          integrity="$(npm view "$package_spec" dist.integrity)"
          if [[ "$integrity" != sha512-* ]]; then
            echo "Registry metadata for $package_spec has no sha512 integrity." >&2
            exit 1
          fi

          registry_tarball="$(npm pack "$package_spec" --silent)"
          tar -tzf "$registry_tarball" > "$RUNNER_TEMP/starreview-registry-contents"
          for required_path in \
            package/package.json \
            package/bin/starreview.js \
            package/src/cli.js \
            package/src/mcp.js \
            package/scripts/production-canary.mjs \
            package/SKILL.md \
            package/README.md \
            package/LICENSE
          do
            if ! grep -Fxq "$required_path" "$RUNNER_TEMP/starreview-registry-contents"; then
              echo "Published tarball is missing $required_path." >&2
              exit 1
            fi
          done
