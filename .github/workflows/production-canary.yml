name: production-canary

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-only-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production-canary
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install exact contract and test dependencies
        run: npm install --ignore-scripts

      - name: Test
        run: npm test

      - name: Pack candidate
        shell: bash
        run: npm pack --silent > "$RUNNER_TEMP/starreview-package-name"

      - name: Exercise packed CLI (read-only)
        shell: bash
        env:
          STARREVIEW_API_KEY: ${{ secrets.STARREVIEW_CANARY_API_KEY }}
          STARREVIEW_TIMEOUT_MS: '30000'
        run: |
          package_name="$(cat "$RUNNER_TEMP/starreview-package-name")"
          npm install --global "./$package_name"
          starreview info > "$RUNNER_TEMP/starreview-info.json"
          starreview locations > "$RUNNER_TEMP/starreview-locations.json"
          node -e "JSON.parse(require('node:fs').readFileSync(process.argv[1], 'utf8'))" "$RUNNER_TEMP/starreview-info.json"
          node -e "JSON.parse(require('node:fs').readFileSync(process.argv[1], 'utf8'))" "$RUNNER_TEMP/starreview-locations.json"

      - name: Exercise public and authenticated discovery (read-only)
        env:
          STARREVIEW_CANARY_API_KEY: ${{ secrets.STARREVIEW_CANARY_API_KEY }}
          STARREVIEW_TIMEOUT_MS: '30000'
        run: npm run canary:production
